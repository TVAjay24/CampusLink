<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE6A" />
      <stop offset="100%" stop-color="#F5C842" />
    </linearGradient>
    
    <linearGradient id="gold-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842" />
      <stop offset="100%" stop-color="#E5AF1B" />
    </linearGradient>
    
    <linearGradient id="gold-dark-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB9F0E" />
      <stop offset="100%" stop-color="#B88005" />
    </linearGradient>

    <linearGradient id="gold-dark-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECAE14" />
      <stop offset="100%" stop-color="#C98B07" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Group containing the network logo -->
  <g id="campuslink-logo" filter="url(#soft-shadow)">

    <!-- Arc Segment 1: Top-Right (from -72 deg to +12 deg) -->
    <!-- Center 256,256 Radius 128 -->
    <path d="M 295.55 134.25 A 128 128 0 0 1 381.20 282.60" 
          fill="none" stroke="url(#gold-mid)" stroke-width="26" stroke-linecap="round" />

    <!-- Arc Segment 2: Bottom (from 48 deg to 132 deg) -->
    <path d="M 341.60 351.20 A 128 128 0 0 1 170.40 351.20" 
          fill="none" stroke="url(#gold-mid)" stroke-width="26" stroke-linecap="round" />

    <!-- Arc Segment 3: Top-Left (from 168 deg to 252 deg / -108 deg) -->
    <path d="M 130.80 282.60 A 128 128 0 0 1 216.45 134.25" 
          fill="none" stroke="url(#gold-mid)" stroke-width="26" stroke-linecap="round" />


    <!-- Connector Stems (off-white fill with gold border) -->
    <!-- Top Stem -->
    <g transform="translate(256, 114) rotate(0)">
      <rect x="-9" y="-22" width="18" height="34" rx="4" fill="#FCFAF2" stroke="#F5C842" stroke-width="3" />
    </g>

    <!-- Bottom-Right Stem -->
    <g transform="translate(352, 298) rotate(120)">
      <rect x="-9" y="-22" width="18" height="34" rx="4" fill="#FCFAF2" stroke="#F5C842" stroke-width="3" />
    </g>

    <!-- Bottom-Left Stem -->
    <g transform="translate(160, 298) rotate(-120)">
      <rect x="-9" y="-22" width="18" height="34" rx="4" fill="#FCFAF2" stroke="#F5C842" stroke-width="3" />
    </g>


    <!-- Outer Node Rings (3 hollow circles) -->
    <!-- Top Node Circle -->
    <circle cx="256" cy="74" r="24" fill="none" stroke="url(#gold-mid)" stroke-width="13" />

    <!-- Bottom-Right Node Circle -->
    <circle cx="413.6" cy="347" r="24" fill="none" stroke="url(#gold-mid)" stroke-width="13" />

    <!-- Bottom-Left Node Circle -->
    <circle cx="98.4" cy="347" r="24" fill="none" stroke="url(#gold-mid)" stroke-width="13" />


    <!-- CENTER GRADUATION CAP (3D MORTARBOARD) -->
    <g transform="translate(0, 10)">
      <!-- Cap Base / Skullcap -->
      <!-- Left Face -->
      <polygon points="198,242 256,273 256,306 198,272" fill="url(#gold-dark-left)" />
      
      <!-- Right Face -->
      <polygon points="256,273 314,242 314,272 256,306" fill="url(#gold-dark-right)" />

      <!-- Top Diamond Board -->
      <polygon points="256,170 348,214 256,258 164,214" fill="url(#gold-bright)" stroke="#E0AD18" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Diamond Under Rim Accent -->
      <polygon points="256,258 348,214 348,218 256,262 164,218 164,214" fill="#D49A09" opacity="0.6" />

      <!-- Tassel -->
      <!-- Center Button -->
      <circle cx="256" cy="214" r="5.5" fill="#E6AC10" />

      <!-- Tassel Cord -->
      <path d="M 256 214 Q 312 228 328 252" fill="none" stroke="#DCA20A" stroke-width="3.5" stroke-linecap="round" />

      <!-- Tassel Ring / Band -->
      <ellipse cx="328" cy="254" rx="4" ry="2.5" fill="#B88005" />

      <!-- Tassel Drop / Fringe -->
      <path d="M 324,256 Q 328,262 326,294 Q 328,298 330,294 Q 328,262 332,256 Z" fill="url(#gold-bright)" stroke="#DCA20A" stroke-width="1" />
    </g>

  </g>
</svg>